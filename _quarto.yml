project:
  type: website
  output-dir: _output
  render:
    - "**/*.qmd"
    - "**/*.md"
    - "!**/*.rmarkdown"
    - "!**/*.knit.md"
    - "!explorations/warming-temporal-pathways/archive/**"
    - "!nas-README.md"

website:
  title: "Exploration"
  description: "Some scientific exploration about geography, limnology, hydrology, oceanography, climatology and so on."
  site-url: https://froq.me/research-site/
  repo-url: https://github.com/0froq/research-site
  favicon: assets/favicon.svg
  open-graph: true
  twitter-card: true
  llms-txt: true
  repo-actions: [edit, source, issue]
  page-navigation: true
  back-to-top-navigation: true

  search:
    location: sidebar
    type: textbox

  navbar:
    title: "Exploration"
    search: false
    pinned: false
    left:
      - text: Explorations
        href: explorations/index.qmd
      - text: Reference
        href: reference/index.qmd
      - text: Notes
        href: notes/index.qmd
    right: []

  sidebar:
    - title: Explorations
      style: floating
      search: true
      collapse-level: 2
      contents:
        - section: Explorations
          href: explorations/index.qmd
          contents:
            - section: Warming Temporal Pathways
              href: explorations/warming-temporal-pathways/index.qmd
              contents:
                - text: Overview
                  href: explorations/warming-temporal-pathways/index.qmd
                - section: Investigations
                  contents:
                    - auto: explorations/warming-temporal-pathways/investigations/*md
                - section: Literature
                  contents:
                    - auto: explorations/warming-temporal-pathways/literature/*md
                - section: Log (raw)
                  contents:
                    - explorations/warming-temporal-pathways/log/index.qmd
                    - auto: explorations/warming-temporal-pathways/log/*md
                - section: Manuscript
                  contents:
                    - auto: explorations/warming-temporal-pathways/manuscript/*md
                    - section: Results
                      href: explorations/warming-temporal-pathways/manuscript/results/index.md
                      contents:
                        - explorations/warming-temporal-pathways/manuscript/results/01-global-kinematics.qmd
                        - explorations/warming-temporal-pathways/manuscript/results/02-within-period-pathways.qmd
                        - explorations/warming-temporal-pathways/manuscript/results/03-warming-patterns.qmd
                        - explorations/warming-temporal-pathways/manuscript/results/04-spatial-organization.qmd
                        - explorations/warming-temporal-pathways/manuscript/results/05-trajectory-robustness.qmd
                        - explorations/warming-temporal-pathways/manuscript/results/06-climate-links.qmd
                    - section: Supplementary analyses
                      href: explorations/warming-temporal-pathways/manuscript/supplementary/index.qmd
                      contents:
                        - explorations/warming-temporal-pathways/manuscript/supplementary/seasonal-ice-context.qmd
                        - explorations/warming-temporal-pathways/manuscript/supplementary/teleconnection-candidate-atlas.qmd
                        - explorations/warming-temporal-pathways/manuscript/supplementary/teleconnection-candidate-tables.qmd
    - title: Reference
      collapse-level: 2
      contents:
        - section: Reference
          href: reference/index.qmd
          contents:
            - section: Methods
              href: reference/methods/index.qmd
              contents:
                - auto: reference/methods/*md
            - section: Datasets
              href: reference/datasets/index.qmd
              contents:
                - auto: reference/datasets/*md
            - section: Indices
              href: reference/indices/index.qmd
              contents:
                - auto: reference/indices/*md
            - section: Concepts
              href: reference/concepts/index.qmd
              contents:
                - auto: reference/concepts/*md
            - section: Metrics
              href: reference/metrics/index.qmd
              contents:
                - auto: reference/metrics/*md
    - title: Notes
      collapse-level: 2
      contents:
        - text: All Notes
          href: notes/index.qmd
        - text: Reading Queue
          href: notes/reading-queue.md
        - section: Papers
          href: notes/papers/index.md
          contents:
            - auto: notes/papers/*md


  page-footer:
    border: true
    center:
      - text: "froq.me"
        href: https://froq.me
    right:
      - icon: github
        href: https://github.com/0froq/research-site
        aria-label: GitHub

format:
  html:
    theme:
      light: theme-light.scss
      dark: theme-dark.scss
    toc: true
    toc-depth: 3
    number-sections: false
    fig-cap-location: bottom
    tbl-cap-location: top
    code-fold: false
    code-tools: false
    mainfont: "Source Sans 3 Variable"
    monofont: "Recursive"
    reference-location: margin
  # pdf:
  #   documentclass: article
  #   papersize: a4
  #   fontsize: 11pt
  #   geometry:
  #     - top=2.5cm
  #     - bottom=2.5cm
  #     - left=2.5cm
  #     - right=2.5cm
  #   include-in-header:
  #     text: |
  #       \usepackage{booktabs}
  #       \usepackage{float}
  #       \floatplacement{figure}{H}
  #   fig-cap-location: bottom
  #   tbl-cap-location: top
  #   number-sections: true

execute:
  freeze: auto
  echo: false
  warning: false
  message: false

bibliography: zotero.bib

crossref:
  fig-prefix: "Figure"
  tbl-prefix: "Table"
  eq-prefix: "Equation"
